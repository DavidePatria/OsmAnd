name: Build Junction iOS

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Build target (device output requires separate Apple signing)
        type: choice
        default: device
        options: [device, simulator]
  push:
    branches: [codex/ios-garmin]
    paths:
      - '.github/workflows/build-junction-ios.yml'
      - 'integrations/garmin/ios/**'
      - 'OsmAnd-shared/**'

permissions:
  contents: read

concurrency:
  group: junction-ios-${{ github.ref }}-${{ inputs.destination || 'device' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2048m -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v4
        with:
          path: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Select the reviewed Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Record runner and toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h "$GITHUB_WORKSPACE"
          java -version
      - name: Install build tools
        run: brew install cmake ninja wget xcodegen
      - name: Restore Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: junction-ios-gradle-${{ runner.arch }}-${{ hashFiles('android/OsmAnd-shared/build.gradle.kts', 'android/versions.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Checkout pinned native sources
        run: python3 android/integrations/garmin/ios/ci.py bootstrap --workspace "$GITHUB_WORKSPACE"
      - name: Apply Junction development adaptation
        run: python3 android/integrations/garmin/ios/ci.py prepare --workspace "$GITHUB_WORKSPACE"
      - name: Compile native OsmAnd and Garmin bridge
        env:
          DESTINATION: ${{ inputs.destination || 'device' }}
        run: python3 android/integrations/garmin/ios/ci.py build --workspace "$GITHUB_WORKSPACE" --destination "$DESTINATION"
      - name: Preserve build evidence and actual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junction-ios-${{ inputs.destination || 'device' }}-${{ github.run_number }}
          path: junction-artifacts/
          if-no-files-found: warn
          retention-days: 7

  bridge:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select the reviewed Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Check source ages and request lifecycle
        shell: bash
        run: |
          swiftc -parse-as-library \
            integrations/garmin/ios/bridge/Sources/Scene.swift \
            integrations/garmin/ios/bridge/Sources/DeliveryGate.swift \
            integrations/garmin/ios/bridge/Sources/CompactWire.swift \
            integrations/garmin/ios/bridge/Tests/ProtocolTests.swift \
            -o "$RUNNER_TEMP/junction-protocol-tests"
          "$RUNNER_TEMP/junction-protocol-tests"
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate and compile the separate Garmin bridge
        shell: bash
        run: |
          mkdir -p junction-bridge-evidence
          xcodegen generate --spec integrations/garmin/ios/bridge/project.yml
          set -o pipefail
          xcodebuild \
            -project integrations/garmin/ios/bridge/JunctionBridge.xcodeproj \
            -scheme JunctionBridge -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/bridge-derived" \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build \
            2>&1 | tee junction-bridge-evidence/build.log
          mkdir -p "$RUNNER_TEMP/bridge-package/Payload"
          cp -R "$RUNNER_TEMP/bridge-derived/Build/Products/Release-iphoneos/JunctionBridge.app" "$RUNNER_TEMP/bridge-package/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/bridge-package/Payload" junction-bridge-evidence/Junction-Bridge-unsigned.ipa
          shasum -a 256 junction-bridge-evidence/Junction-Bridge-unsigned.ipa > junction-bridge-evidence/artifact.sha256
          printf '%s\n' 'Unsigned device app: Apple signing and provisioning are required before installation.' > junction-bridge-evidence/SIGNING.txt
      - name: Preserve bridge compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junction-ios-bridge-check-${{ github.run_number }}
          path: junction-bridge-evidence/
          if-no-files-found: warn
          retention-days: 7
